<ion-content [fullscreen]="true" class="auth-content">
  <div class="auth-wrapper">
    <!-- Header Logo & Greeting -->
    <div class="auth-header ion-text-center">
      <div class="logo-box">
        <ion-icon name="medical-outline" color="primary"></ion-icon>
      </div>
      <h2>{{ ts.translate('appName') }}</h2>
      <p>{{ ts.translate('homeSubtitle') }}</p>
    </div>

    <!-- Card Container -->
    <ion-card class="auth-card ion-no-margin">
      <ion-card-content>
        <h3 class="card-title">{{ ts.translate('forgotPasswordTitle') }}</h3>
        <p style="margin: 0 0 1.5rem; color: #718096; font-size: 0.9rem; line-height: 1.4;">
          {{ ts.translate('forgotPasswordDesc') }}
        </p>

        <form (ngSubmit)="onSubmit()">
          <!-- Email Input -->
          <div class="input-group">
            <ion-label class="input-label">{{ ts.translate('email') }}</ion-label>
            <ion-item lines="none" class="custom-input-item">
              <ion-input
                type="email"
                placeholder="email@example.com"
                [(ngModel)]="email"
                name="email"
                required>
              </ion-input>
            </ion-item>
          </div>

          <!-- Error Alert -->
          <p *ngIf="errorMessage" class="error-msg">
            <ion-icon name="alert-circle-outline" style="margin-right: 0.25rem;"></ion-icon>
            {{ errorMessage }}
          </p>

          <!-- Success Alert -->
          <p *ngIf="successMessage" class="success-msg" style="color: #2dd36f; margin-top: 1rem; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center;">
            <ion-icon name="checkmark-circle-outline" style="margin-right: 0.25rem; font-size: 1.1rem;"></ion-icon>
            {{ successMessage }}
          </p>

          <!-- Submit Button -->
          <ion-button expand="block" type="submit" class="submit-btn">
            {{ ts.translate('forgotBtn') }}
          </ion-button>
        </form>

        <!-- Divider / Footer Links -->
        <div class="auth-footer ion-text-center">
          <p>
            <a routerLink="/auth/login">{{ ts.translate('login') }}</a>
          </p>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
