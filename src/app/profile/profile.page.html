<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>My Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear">
        <ion-icon slot="icon-only" name="settings-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="profile-header">
    <div class="avatar-container">
      <div class="avatar-inner">
        <ion-icon name="person-outline"></ion-icon>
      </div>
    </div>
    <h2>{{ user.name }}</h2>
    <p>{{ user.age }} years old • Health Explorer</p>
  </div>

  <ion-card class="stats-card">
    <ion-card-content>
      <div class="stats-grid">
        <div *ngFor="let item of stats" class="stat-item">
          <strong>{{ item.value }}</strong>
          <span>{{ item.label }}</span>
        </div>
      </div>
    </ion-card-content>
  </ion-card>

  <div class="section-title">Health Focus</div>
  <ion-card class="info-card">
    <ion-card-content>
      <p style="margin: 0; color: var(--ion-color-medium); font-size: 0.9rem;">
        {{ user.goal }}
      </p>
      <div class="chip-container">
        <ion-chip color="primary">Hydration</ion-chip>
        <ion-chip color="success">Exercise</ion-chip>
        <ion-chip color="warning">Sleep</ion-chip>
      </div>
    </ion-card-content>
  </ion-card>

  <div class="section-title">Account Settings</div>
  <ion-list class="settings-list ion-no-padding">
    <ion-item button lines="full">
      <ion-icon slot="start" name="person-outline" color="primary"></ion-icon>
      <ion-label>Edit Profile</ion-label>
    </ion-item>
    <ion-item button lines="full">
      <ion-icon slot="start" name="notifications-outline" color="success"></ion-icon>
      <ion-label>Notifications</ion-label>
    </ion-item>
    <ion-item button lines="full">
      <ion-icon slot="start" name="shield-outline" color="warning"></ion-icon>
      <ion-label>Privacy & Security</ion-label>
    </ion-item>
    <ion-item button lines="none">
      <ion-icon slot="start" name="help-circle-outline" color="medium"></ion-icon>
      <ion-label>Help & Support</ion-label>
    </ion-item>
  </ion-list>

  <div style="padding: 0 1.25rem 2rem;">
    <ion-button expand="block" fill="clear" color="danger" style="font-weight: 700;">
      Log Out
    </ion-button>
  </div>
</ion-content>
